plugins { id 'com.android.application' }

android {
    namespace 'com.vectoragent.phone'
    compileSdk 35
    // Keep debug APK signing stable across clean GitHub Actions runners. This file is
    // generated once per branch and reused from the branch-scoped Actions cache.
    signingConfigs {
        debug {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    defaultConfig {
        applicationId 'com.vectoragent.phone'
        minSdk 26
        targetSdk 35
        versionCode 383
        versionName '3.8.3'
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.11.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
