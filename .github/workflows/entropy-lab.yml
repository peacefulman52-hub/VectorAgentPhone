name: Entropy Lab — model pilot

on:
  push:
    branches:
      - main
      - "lab/**"
    paths:
      - "research/entropy-lab/**"
      - ".github/workflows/entropy-lab.yml"
  pull_request:
    paths:
      - "research/entropy-lab/**"
      - ".github/workflows/entropy-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-protocol:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate preregistered protocol
        run: python research/entropy-lab/validate_protocol.py
      - name: Upload protocol validation record
        uses: actions/upload-artifact@v4
        with:
          name: entropy-lab-protocol-validation
          path: research/entropy-lab/results/protocol_validation.json
          if-no-files-found: error
          retention-days: 30

  run-model-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.57.6" "huggingface-hub<1.0"
      - name: Run exploratory activation-calibration pilot
        run: python research/entropy-lab/run_model_pilot.py
      - name: Upload raw measurements and summary
        uses: actions/upload-artifact@v4
        with:
          name: entropy-lab-model-pilot
          path: research/entropy-lab/results/model_experiment.json
          if-no-files-found: error
          retention-days: 90
