name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VectorAgentPhone-1.0.1-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.1 app/build/outputs/apk/debug/app-debug.apk --title "VectorAgentPhone v1.0.1" --notes "v1.0.1: repeated supporting observations can promote accumulated knowledge to ACTIVE." || true


