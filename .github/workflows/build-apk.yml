name: Build APK
on:
  push:
    branches: [ main, vector-lab-2.0, research-engine-3.1, astra-bridge-3.2, hotfix-astra-open-url-crash-3.2.1, astra-link-3.3.0 ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VectorAgentPhone-3.3.3-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v3.3.3 app/build/outputs/apk/debug/app-debug.apk --title "VectorAgentPhone v3.3.3" --notes "Astra Bridge remembers the last external window and keeps the action journal collapsed by default." || true
