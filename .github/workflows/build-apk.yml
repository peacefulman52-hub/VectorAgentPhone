name: Build APK
on:
  push:
    branches: [ main, vector-lab-2.0, research-engine-3.1, astra-bridge-3.2, hotfix-astra-open-url-crash-3.2.1, astra-link-3.3.0, feature/mentor-reply-process-button-3-8-1, feature/entropia-3-8-2-mentor-analysis ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
# Avoid wasting runner time on stale commits when the branch advances.
concurrency:
  group: entropia-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Cache only this ref's debug key. No restore-keys: do not share it with PRs/other branches.
      - name: Reuse branch-scoped debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: entropia-debug-signing-key-${{ github.ref_name }}-v1
      - name: Ensure debug signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | grep -E "SHA256:"
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
      - name: Run offline research regression tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK archive, package, and version metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE="$(stat -c '%s' "$APK")"
          echo "APK byte size: $SIZE"
          if [ "$SIZE" -lt 500000 ]; then
            echo "::error::APK is suspiciously small; refusing to upload an incomplete package"
            exit 1
          fi
          unzip -t "$APK" | tail -n 1
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.vectoragent.phone' versionCode='383' versionName='3.8.3'"
      - name: Verify APK signing certificate matches cached debug key
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          KEY_SHA="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          APK_SHA="$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "Cached debug key SHA-256: $KEY_SHA"
          echo "Built APK signer SHA-256: $APK_SHA"
          test -n "$KEY_SHA" && test -n "$APK_SHA"
          if [ "$KEY_SHA" != "$APK_SHA" ]; then
            echo "::error::APK certificate does not match the cached debug keystore"
            exit 1
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Entropia-3.8.3-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v3.8.3 app/build/outputs/apk/debug/app-debug.apk --title "Энтропия v3.8.3" --notes "Adds an opt-in local ChatGPT bridge, codeword-based reply capture, preliminary memory storage, and APK integrity checks." || true
