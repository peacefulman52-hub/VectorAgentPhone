name: Build APK
on:
  push:
    branches: [ main, vector-lab-2.0, research-engine-3.1, astra-bridge-3.2, hotfix-astra-open-url-crash-3.2.1, astra-link-3.3.0, feature/mentor-reply-process-button-3-8-1, feature/entropia-3-8-2-mentor-analysis ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
# Avoid wasting runner time on stale commits when the branch advances.
concurrency:
  group: entropia-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Cache only this ref's debug key. No restore-keys: do not share it with PRs/other branches.
      - name: Reuse branch-scoped debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: entropia-debug-signing-key-${{ github.ref_name }}-v1
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
      - name: Run offline research regression tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Entropia-3.8.2-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v3.8.2 app/build/outputs/apk/debug/app-debug.apk --title "Энтропия v3.8.2" --notes "Adds offline structural mentor-reply analysis, a visible report, and isolation from ordinary research knowledge." || true
