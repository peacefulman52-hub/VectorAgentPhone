name: Build APK
on:
  push:
    branches: [ main, vector-lab-2.0, research-engine-3.1, astra-bridge-3.2, hotfix-astra-open-url-crash-3.2.1, astra-link-3.3.0, feature/mentor-reply-process-button-3-8-1 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
      - name: Run offline research regression tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Entropia-3.8.1-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v3.8.1 app/build/outputs/apk/debug/app-debug.apk --title "Энтропия v3.8.1" --notes "Adds an explicit Process Mentor Reply button and safe preliminary-only import with regression coverage." || true
