name: Build Vector Lab 3 APK
on:
  push:
    branches: [ main, vector-lab-2.0 ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VectorAgentPhone-3.0.0-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v3.0.0 app/build/outputs/apk/debug/app-debug.apk --title "VectorAgentPhone v3.0.0" --notes "Vector Lab 3.0: persistent research cycles, competing hypotheses, informative experiment selection, persistent cycle history." || true
