name: Deploy Astra Link Relay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ASTRA_TOKEN: ${{ secrets.ASTRA_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add repository Actions secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add repository Actions secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$ASTRA_TOKEN" || { echo "::error::Add repository Actions secret ASTRA_TOKEN"; exit 1; }

      - name: Deploy Worker from relay directory
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml

      - name: Store ASTRA_TOKEN as a Worker secret
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ASTRA_TOKEN: ${{ secrets.ASTRA_TOKEN }}
        shell: bash
        run: printf '%s' "$ASTRA_TOKEN" | npx --yes wrangler@4 secret put ASTRA_TOKEN --config wrangler.toml
