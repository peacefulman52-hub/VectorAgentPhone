name = "astra-link-relay"
main = "cloudflare-worker.js"
compatibility_date = "2026-10-08"

[vars]
# Set ASTRA_TOKEN as a secret, not in this file.
# wrangler secret put ASTRA_TOKEN

[durable_objects]
bindings = [
  { name = "ASTRA_QUEUE", class_name = "AstraQueue" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AstraQueue"]
